upstream stresssignal_app {
    server 127.0.0.1:3014 fail_timeout=0;
    keepalive 64;
}

map $http_upgrade $stresssignal_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name stresssignal.app www.stresssignal.app;

    return 301 https://stresssignal.app$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.stresssignal.app;

    ssl_certificate /etc/nginx/ssl/stresssignal.app/stresssignal.app.pem;
    ssl_certificate_key /etc/nginx/ssl/stresssignal.app/stresssignal.app.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:StressSignalSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://stresssignal.app$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stresssignal.app;

    client_max_body_size 5m;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $stresssignal_connection_upgrade;

        proxy_pass http://stresssignal_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 24k;
        proxy_buffers 64 4k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    }

    ssl_certificate /etc/nginx/ssl/stresssignal.app/stresssignal.app.pem;
    ssl_certificate_key /etc/nginx/ssl/stresssignal.app/stresssignal.app.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:StressSignalSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
}
