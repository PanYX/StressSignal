name: stresssignal_default

services:
  app:
    image: ${NEXT_IMAGE:-stresssignal-web:latest}
    restart: always
    networks:
      - stresssignal-network
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  stresssignal-network:
    driver: bridge
