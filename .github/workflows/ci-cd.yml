name: CI-CD

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stresssignal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate D1 Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated content and Cloudflare types
        run: |
          pnpm content:check
          pnpm cf:typecheck

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      - name: D1 integration tests
        run: pnpm test:integration

      - name: Build OpenNext Worker
        env:
          NEXT_PUBLIC_SITE_URL: https://stresssignal.app
          STRESSSIGNAL_D1_REMOTE: "false"
        run: pnpm exec opennextjs-cloudflare build

      - name: Enforce Worker bundle budget
        run: pnpm bundle:check

      - name: Build scheduler Worker
        run: pnpm exec wrangler deploy --config wrangler.scheduler.jsonc --dry-run

  deploy-production:
    name: Deploy production Worker
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://stresssignal.app
      STRESSSIGNAL_D1_REMOTE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm db:migrate

      - name: Build OpenNext Worker
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy application Worker
        run: pnpm exec opennextjs-cloudflare deploy -- --keep-vars

      - name: Deploy scheduler Worker
        run: pnpm deploy:scheduler
